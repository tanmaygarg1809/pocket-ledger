name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project and overlay
        run: |
          chmod +x setup.sh
          ./setup.sh com.pocketledger.app
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish the APK as a release (easy download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk PocketLedger.apk
          gh release create "build-${{ github.run_number }}" PocketLedger.apk \
            --title "Kharcha build ${{ github.run_number }}" \
            --notes "Open PocketLedger.apk on your phone to install. Installing over an older build keeps your data."
